name: Audit

# Audit informatif des dépendances (advisories RustSec). Ne bloque jamais un merge ni une publication.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi 06:00 UTC

permissions:
  contents: read
  checks: write
  issues: write           # indispensable : c'est ce qui crée une issue par advisory

jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    continue-on-error: true   # informatif
    steps:
      - uses: actions/checkout@v7
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

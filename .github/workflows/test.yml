---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Liste d'objets { name, args } : `args` porte la ligne de flags complète, ce que la
      # forme « features: [...] » ne pouvait pas exprimer pour `--no-default-features` seul
      # (confondu avec l'entrée vide). Huit portes sont contractuelles parce qu'elles sont les
      # seules à jouer un verrou nommé (tooling.sdd, workflows.sdd) : `no-default` (seam de la
      # racine), `hbs` seul (isolabilité #9 en exécution), `crypto` seul (seule famille de
      # portes où le verrou `#[cfg(not(feature = "rhai"))]` de crate::key::gen_private_key
      # s'exécute), `rhai` seul (seule porte qui joue la glue Rhai en tests sans les features
      # qu'elle câble — elle y joue les onze verrous `mod script` de src/password.rs — et porte
      # où l'évaluation de `gen_private_key` de la demi-clause « fonction inconnue » du Scenario
      # `sans crypto` de src/key.sdd a son domaine (verrou
      # `new_bare_without_crypto_rejects_gen_private_key`, écrit et joué sur cette porte),
      # `hbs-crypto` (seul graphe qui compile et joue un helper Handlebars `crypto` sans
      # `rhai`), `rhai-shell` (seule porte qui joue les cinq verrous
      # `all(test, shell, rhai)` de src/shell.rs — signal `143` des deux collages, rc et
      # extrait stderr borné à 512 octets ; sous les dix portes précédentes, leur face
      # n'était que linte par `--all-features --all-targets`, jamais jouée) et `rhai-fs` /
      # `rhai-password` (seules portes nommées qui jouent les branches gated de `new_bare`
      # que src/engine.rs enregistre — `fs` et `password` n'impliquant pas `rhai`, la matrice
      # `--each-feature` ne compile AUCUNE de ces branches hors `--all-features`, mesuré
      # 2026-10-10 ; décision du développeur principal). `hbs-crypto`, `rhai-shell`,
      # `rhai-fs` et `rhai-password` passent leurs features séparées par des virgules
      # (`--features hbs,crypto`, `--features rhai,shell`, `--features rhai,fs`,
      # `--features rhai,password`) : `${{ matrix.args }}` est substitué
      # textuellement dans le script joué par le shell, et la virgule rend la ligne
      # indépendante de ce découpage — sans guillemets (`--features hbs crypto`), `crypto`
      # passerait hors de l'argument ; avec guillemets (`--features "hbs crypto"`) cela
      # marche, mais les guillemets deviennent portants par la substitution. Pour cargo,
      # `hbs,crypto` est strictement équivalent à « hbs crypto ».
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: "--no-default-features"
          - name: hbs
            args: "--no-default-features --features hbs"
          - name: k8s
            args: "--no-default-features --features k8s"
          - name: oci
            args: "--no-default-features --features oci"
          - name: s3
            args: "--no-default-features --features s3"
          - name: k8s,oci,s3
            args: "--no-default-features --features k8s,oci,s3"
          - name: crypto
            args: "--no-default-features --features crypto"
          - name: rhai
            args: "--no-default-features --features rhai"
          - name: hbs-crypto
            args: "--no-default-features --features hbs,crypto"
          - name: rhai-shell
            args: "--no-default-features --features rhai,shell"
          - name: rhai-fs
            args: "--no-default-features --features rhai,fs"
          - name: rhai-password
            args: "--no-default-features --features rhai,password"
          # `rt` seul : seule porte où le pont public `rt::block_on` (issue #23) se compile sans
          # `rhai` ; joue le consommateur externe de ./tests/rt_block_on_public.rs.
          - name: rt
            args: "--no-default-features --features rt"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test ${{ matrix.args }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      # Contrôle des specs `.sdd` par l'outil SpecDD officiel (`specdd lint`), pas par un
      # script maison — tâche de ../../tooling.sdd (« Jouer `specdd lint` en CI ») et sa
      # tâche jumelle ici (workflows.sdd). Version épinglée : `lint` évolue avec l'outil
      # (Node >= 22 requis). Périmètre : tous les `.sdd` du dépôt ; le
      # `.specdd/bootstrap.md` tiers n'est pas un `.sdd`.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install SpecDD CLI
        run: npm install --global specdd@1.2.0

      - name: specdd lint
        run: specdd lint

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Harnais clippy porté par Cargo.toml [lints] (strict family + pedantic/cargo en deny,
      # missing_docs warn) + `-D warnings` pour les warnings rustc hors [lints]. Ce job rejoue
      # en explicite, entre le `--all-targets` par défaut et le `--all-features`, les portes
      # `k8s`, `oci`, `s3`, `k8s,oci,s3`, `crypto`, `rhai`, `hbs,crypto`, `rhai,shell`,
      # `rhai,fs` et `rhai,password`, ainsi que `rt` (pont public sans `rhai`). Les
      # quatre premières parce que les analyses pedantic (pureté de `must_use_candidate`, etc.)
      # dépendent du graphe de features et qu'un lint peut ne se déclencher que sur une
      # combinaison (voir ../../tooling.sdd) ; `crypto`, `rhai`, `hbs,crypto`, `rhai,shell`,
      # `rhai,fs` et `rhai,password`
      # parce que les verrous des portes jouées doivent rougir en lint comme en exécution —
      # `crypto` seul (le verrou `#[cfg(not(feature = "rhai"))]` de
      # crate::key::gen_private_key), `rhai` seul (les onze verrous `mod script` de
      # src/password.rs, et la porte où la demi-clause « fonction inconnue » de src/key.sdd a
      # son domaine — verrou `new_bare_without_crypto_rejects_gen_private_key`, écrit et
      # joué), `hbs,crypto` (seul graphe qui compile un helper Handlebars `crypto` sans
      # `rhai`, src/hbs.sdd), `rhai,shell` (les cinq verrous `all(test, shell, rhai)` de
      # src/shell.rs — signal `143` des deux collages, rc et extrait stderr borné à 512
      # octets) et `rhai,fs` / `rhai,password` (les branches gated de `new_bare` que
      # src/engine.rs enregistre — `fs` et `password` n'impliquant pas `rhai`, la matrice
      # `--each-feature` ne compile AUCUNE de ces branches hors `--all-features`).
      # Le job `feature-matrix` compile bien ces graphes (`--each-feature` couvre
      # `crypto` et `rhai` seuls), mais avec `--no-dev-deps` : il ne construit ni les dix
      # binaires de ./tests ni les cibles `cfg(test)` où vivent les verrous, et n'isole qu'une
      # feature à la fois — `hbs,crypto`, `rhai,shell`, `rhai,fs` et `rhai,password` lui sont
      # impossibles.
      # `set -e` : la première combinaison qui tombe fait échouer le job.
      - name: cargo clippy (feature matrix)
        run: |
          set -e
          cargo clippy --all-targets -- -D warnings
          for features in k8s oci s3 k8s,oci,s3 crypto rhai hbs,crypto rhai,shell rhai,fs rhai,password rt; do
            cargo clippy --no-default-features --features "$features" --all-targets -- -D warnings
          done
          cargo clippy --all-features --all-targets -- -D warnings

      # Lints rustdoc (tooling.sdd, lockstep des quatre emplacements) : RUSTDOCFLAGS
      # « -D warnings » promeut les warnings rustdoc (liens intra-doc cassés, fences de
      # doctest invalides…) en erreurs. Default puis `--all-features` ici ; les graphes
      # réduits sont joués par `cargo hack doc --each-feature` dans `feature-matrix`
      # (issue #25 : un lien vers un item gated est du texte brut, jamais un lien résolu).
      - name: rustdoc lints
        run: |
          set -e
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  # Règle d'isolation de chaque feature (tooling.sdd) : --each-feature compile et linte
  # chaque feature seule, y compris les gates qu'aucune des listes explicites des jobs
  # `test` et `clippy` ne nomme isolement (fs, shell, password, http, hbs-scripting…), et
  # vérifie ainsi l'invariant d'isolabilité de `hbs` (vyvil-core.sdd). Comme il tourne en
  # --no-dev-deps, il ne construit ni les dix binaires de ./tests ni les cibles
  # `cfg(test)` où vivent les verrous, et comme il n'isole qu'une feature à la fois, il ne
  # joue aucune combinaison à deux features. Les combinaisons explicites restent donc en
  # plus (../../tooling.sdd) : celles qui portent un sens (k8s,oci,s3, --all-features,
  # crypto, rhai, hbs,crypto, rhai,shell, rhai,fs, rhai,password).
  feature-matrix:
    name: Feature matrix (cargo hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo hack check --each-feature
        run: cargo hack check --each-feature --no-dev-deps

      - name: cargo hack clippy --each-feature
        run: cargo hack clippy --each-feature --no-dev-deps -- -D warnings

      # Lints rustdoc sur chaque graphe isolé (issue #25) : les liens intra-doc de la
      # doc de crate se résolvent sous chaque feature seule et sous `--no-default-features`.
      - name: cargo hack doc --each-feature
        run: RUSTDOCFLAGS="-D warnings" cargo hack doc --each-feature --no-dev-deps --no-deps
